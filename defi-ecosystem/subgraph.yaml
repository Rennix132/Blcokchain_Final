specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AMMFactory
    network: sepolia
    source:
      address: "0x5298f56dc4eb16cc387770034a6415756cb72758"
      abi: AMMFactory
      startBlock: 10865051
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: AMMFactory
          file: ./abis/AMMFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/amm-factory.ts
